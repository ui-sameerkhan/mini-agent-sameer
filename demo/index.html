<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shughl — Demo</title><meta name="theme-color" content="#0f766e">
<style>
:root{--teal:#0f766e;--teal-d:#0b5c56;--teal-l:#e6f4f2;--amber:#f59e0b;--ink:#13262b;--mute:#5b6b70;--line:#dde5e7;--bg:#f6f9f9;--red:#b91c1c}
*{box-sizing:border-box}body{margin:0;font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif;color:var(--ink);background:var(--bg)}
a{color:var(--teal);text-decoration:none;cursor:pointer}h1,h2,h3{line-height:1.25;margin:0 0 .5em}h1{font-size:1.8rem}h2{font-size:1.3rem}h3{font-size:1.1rem}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}main{padding:18px 0 40px;min-height:70vh}
.demo{background:#13262b;color:#fff;font-size:.85rem;padding:6px 0}.demo .wrap{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.demo button{background:#fff2;color:#fff;border:1px solid #fff5;border-radius:8px;padding:4px 10px;cursor:pointer}.demo button.on{background:var(--amber);color:#000;border-color:var(--amber)}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}header .wrap{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.logo{font-weight:800;font-size:1.4rem;color:var(--teal);margin-inline-end:auto}.logo b{color:var(--amber)}
nav a,nav button{padding:10px 12px;border-radius:10px;color:var(--ink);font-weight:600;background:none;border:0;font:inherit;font-weight:600;cursor:pointer}nav a:hover{background:var(--teal-l)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 20px;border-radius:12px;border:2px solid var(--teal);background:var(--teal);color:#fff;font:inherit;font-weight:700;cursor:pointer;text-align:center}
.btn.alt{background:#fff;color:var(--teal)}.btn.amber{background:var(--amber);border-color:var(--amber);color:#1b1100}.btn.danger{background:#fff;color:var(--red);border-color:var(--red)}.btn.sm{min-height:36px;padding:4px 12px;font-size:.9rem}.btn.big{width:100%;min-height:58px;font-size:1.15rem}
input,select,textarea{width:100%;min-height:48px;padding:10px 12px;border:1.5px solid #b9c6c9;border-radius:10px;font:inherit;background:#fff}textarea{min-height:100px}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--teal)}label{display:block;font-weight:600;margin:10px 0 4px}label.chk{display:flex;gap:10px;align-items:center;font-weight:500;margin:5px 0}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.stack>*+*{margin-top:14px}.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(min-width:640px){.cats{grid-template-columns:repeat(4,1fr)}}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 6px;background:#fff;border:2px solid var(--line);border-radius:14px;font-weight:700;text-align:center;color:var(--ink)}.cat:hover{border-color:var(--teal)}.cat i{font-size:2.5rem;font-style:normal;line-height:1}.cat.w{border-style:dashed}
.hero{background:linear-gradient(135deg,var(--teal),#134e4a);color:#fff;border-radius:20px;padding:26px 18px}.hero p{opacity:.92}.hero form{display:grid;gap:10px}@media(min-width:720px){.hero form{grid-template-columns:2fr 1fr auto}}
.safe{background:#fffbeb;border:1.5px solid var(--amber);border-radius:12px;padding:12px 14px;font-weight:600;color:#78350f}.err{background:#fee2e2;color:var(--red);padding:10px 12px;border-radius:10px;font-weight:600}.ok{background:#dcfce7;color:#166534;padding:10px 12px;border-radius:10px;font-weight:600}
.job{display:block;color:inherit;cursor:pointer}.job:hover{border-color:var(--teal)}.meta{color:var(--mute);font-size:.93rem}.sal{font-weight:800;color:var(--teal-d)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.badge{font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--teal-l);color:var(--teal-d)}.badge.u{background:#fee2e2;color:var(--red)}.badge.v{background:#dcfce7;color:#166534}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:#eef2f3;font-size:.85rem;font-weight:700}
@media(min-width:900px){.layout{display:grid;grid-template-columns:250px 1fr;gap:18px;align-items:start}}.fl{display:grid;gap:8px}
table{width:100%;border-collapse:collapse;font-size:.95rem}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
footer{background:#0b2e2b;color:#cfe3e1;padding:22px 0;font-size:.9rem}
</style></head><body>
<div class="demo"><div class="wrap"><b>DEMO</b> no server, data stays in this browser. Acting as:
<button data-role="guest">Guest</button><button data-role="worker">Worker</button><button data-role="employer">Employer</button><button data-role="admin">Admin</button>
<button id="reset" style="margin-inline-start:auto">Reset demo</button></div></div>
<header><div class="wrap"><a class="logo" href="#/">Shughl<b>.</b></a><nav id="nav"></nav></div></header>
<main><div class="wrap" id="app"></div></main>
<footer><div class="wrap" id="foot"></div></footer>
<script>
const CATS=[["driver","🚗","Drivers","سائقون","b"],["construction","🏗️","Construction","البناء","b"],["cleaning","🧹","Cleaners","عمال نظافة","b"],["security","💂","Security","الأمن","b"],["hospitality","🍽️","Hospitality","الضيافة","b"],["factory","🏭","Factory","المصانع","b"],["delivery","🛵","Delivery","التوصيل","b"],["technician","🔧","Technicians","فنيون","b"],["office","🗂️","Office & Admin","إدارة ومكتب","w"],["it","💻","IT & Software","تقنية المعلومات","w"],["finance","📊","Finance","المالية","w"],["sales","🤝","Sales & Marketing","المبيعات","w"],["management","🧭","Management","الإدارة","w"],["healthcare","🩺","Healthcare","الرعاية الصحية","w"]];
const CITIES=["Dubai","Abu Dhabi","Sharjah","Ajman","Ras Al Khaimah","Fujairah","Al Ain"];
const T={en:{jobs:"Jobs",post:"Post a job",pricing:"Pricing",login:"Log in",logout:"Log out",title:"Find work you can trust",sub:"Real jobs from verified UAE employers. You never pay to apply.",kw:"Job title or keyword",allc:"All cities",search:"Search",work:"What work do you do?",latest:"Latest jobs",apply:"Apply now",applied:"Applied",never:"Jobseekers never pay to apply. If anyone asks you for money, report the job.",urgent:"Urgent hiring",visa:"Visa provided",acc:"Accommodation",trans:"Transport",food:"Food allowance",ver:"Verified employer",nego:"Negotiable",phone:"Phone number",send:"Send code",enter:"Enter the 6-digit code",verify:"Verify",myapps:"My applications",dash:"Dashboard",admin:"Admin",nojobs:"No jobs found.",wlogin:"I am looking for a job (phone)"},
ar:{jobs:"الوظائف",post:"انشر وظيفة",pricing:"الأسعار",login:"تسجيل الدخول",logout:"خروج",title:"ابحث عن عمل موثوق",sub:"وظائف حقيقية من أصحاب عمل موثّقين في الإمارات. لا تدفع أبدًا للتقديم.",kw:"المسمى الوظيفي أو كلمة",allc:"كل المدن",search:"بحث",work:"ما هو عملك؟",latest:"أحدث الوظائف",apply:"قدّم الآن",applied:"تم التقديم",never:"لا يدفع الباحث عن عمل أي مبلغ للتقديم. إذا طلب أحد منك مالًا فأبلغ عن الوظيفة.",urgent:"توظيف عاجل",visa:"التأشيرة متوفرة",acc:"سكن",trans:"مواصلات",food:"بدل طعام",ver:"صاحب عمل موثّق",nego:"قابل للتفاوض",phone:"رقم الهاتف",send:"أرسل الرمز",enter:"أدخل الرمز المكوّن من 6 أرقام",verify:"تحقق",myapps:"طلباتي",dash:"لوحة التحكم",admin:"الإدارة",nojobs:"لا توجد وظائف.",wlogin:"أبحث عن عمل (هاتف)"}};
const SEED=[
[1,"Light Vehicle Driver","driver","Dubai","Deira","full-time",2200,2800,"month","English, Hindi, Urdu",1,1,1,0,10,"Valid UAE licence required. Deliver staff and light cargo within Dubai.",1],
[2,"Construction Labourer","construction","Abu Dhabi","Mussafah","full-time",1200,1500,"month","Hindi, Urdu, Bengali, Nepali",1,1,1,1,50,"Bulk hiring for a tower project. Safety training provided.",1],
[3,"Office Cleaner","cleaning","Sharjah","Al Majaz","full-time",1100,1400,"month","English, Tagalog, Hindi",1,1,0,1,6,"Clean offices and common areas. Uniform provided.",0],
[4,"Security Guard","security","Dubai","Business Bay","full-time",1800,2200,"month","English, Hindi, Urdu",1,1,1,0,8,"SIRA card preferred. Night and day shifts.",0],
[5,"Food Delivery Rider","delivery","Dubai","Marina","daily wage",180,250,"day","English, Arabic, Hindi",0,0,0,1,30,"Own motorcycle licence needed. Bike provided.",1],
[6,"Electrician","technician","Ajman","Industrial Area","contract",2500,3200,"month","English, Hindi",1,1,1,0,4,"MEP maintenance electrician with trade certificate.",0],
[7,"Accountant","finance","Dubai","JLT","full-time",6000,9000,"month","English, Arabic",1,0,0,0,1,"AP/AR, VAT returns, month-end close. Tally or Zoho Books.",0],
[8,"Full-Stack Developer","it","Abu Dhabi","Al Reem","full-time",12000,18000,"month","English",1,0,0,0,2,"React + Node.js. Build internal logistics tools.",0]
].map(a=>({id:a[0],title:a[1],cat:a[2],city:a[3],area:a[4],type:a[5],min:a[6],max:a[7],per:a[8],langs:a[9],visa:a[10],acc:a[11],trans:a[12],food:a[13],vac:a[14],desc:a[15],urgent:a[16],company:"Gulf Star Services LLC",verified:1,status:"active"}));
const SCAM=[/\b(registration|processing|application|visa|medical|training|security|joining|agent|recruitment)\s+(fee|fees|charge|deposit|payment)\b/i,/\b(pay|send|transfer|deposit)\b[^.\n]{0,40}\b(aed|dirhams?|money|fee|fees|cash)\b/i,/\b(refundable|advance)\s+(deposit|payment|fee)\b/i,/\b(western union|moneygram|bitcoin|gift ?card)\b/i];
let S;const load=()=>{try{S=JSON.parse(localStorage.getItem("shughl_demo"))}catch(e){}if(!S)S={lang:"en",role:"guest",jobs:SEED,apps:[],reports:[],saved:[]}};const save=()=>{try{localStorage.setItem("shughl_demo",JSON.stringify(S))}catch(e){}};
load();const t=k=>(T[S.lang]||T.en)[k]||T.en[k]||k,$=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cat=id=>CATS.find(c=>c[0]===id)||[id,"💼",id,id,"b"],cname=id=>S.lang==="ar"?cat(id)[3]:cat(id)[2];
const sal=j=>j.nego||(!j.min&&!j.max)?t("nego"):`AED ${j.min===j.max||!j.max?j.min:j.min.toLocaleString()+"–"+j.max.toLocaleString()} / ${j.per}`;
const badges=j=>`<div class="badges">${j.urgent?`<span class="badge u">🔥 ${t("urgent")}</span>`:""}${j.visa?`<span class="badge">🛂 ${t("visa")}</span>`:""}${j.acc?`<span class="badge">🏠 ${t("acc")}</span>`:""}${j.trans?`<span class="badge">🚌 ${t("trans")}</span>`:""}${j.food?`<span class="badge">🍛 ${t("food")}</span>`:""}${j.verified?`<span class="badge v">✔ ${t("ver")}</span>`:""}</div>`;
const card=j=>`<a class="card job" href="#/job/${j.id}"><div style="display:flex;gap:12px"><div style="font-size:2.3rem">${cat(j.cat)[1]}</div><div style="flex:1;min-width:0"><h3>${esc(j.title)}</h3><div class="meta">${esc(j.company)} · ${esc(j.city)}, ${esc(j.area)}</div><div class="sal">${sal(j)}</div>${badges(j)}<div class="meta">${cname(j.cat)} · ${j.type}${j.vac>1?" · "+j.vac+" vacancies":""}</div></div></div></a>`;
const live=()=>S.jobs.filter(j=>j.status==="active");
function chrome(){document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==="ar"?"rtl":"ltr";
document.querySelectorAll("[data-role]").forEach(b=>b.classList.toggle("on",b.dataset.role===S.role));
const r=S.role;$("#nav").innerHTML=`<a href="#/jobs">${t("jobs")}</a>${r==="guest"||r==="employer"?`<a href="#/${r==="employer"?"employer/new":"login"}">${t("post")}</a>`:""}<a href="#/pricing">${t("pricing")}</a><button id="lg">🌐 ${S.lang==="ar"?"English":"العربية"}</button>${r==="worker"?`<a href="#/apps">${t("myapps")}</a>`:r==="employer"?`<a href="#/employer">${t("dash")}</a>`:r==="admin"?`<a href="#/admin">${t("admin")}</a>`:`<a href="#/login">${t("login")}</a>`}`;
$("#lg").onclick=()=>{S.lang=S.lang==="ar"?"en":"ar";save();route()};
$("#foot").innerHTML=`<b>Shughl</b> — ${t("never")}<br><span style="opacity:.7">Demo prototype. The full app has a real database, phone codes, uploads and admin approval.</span>`}
const V={};
V.home=()=>{const l=live().slice(0,6);return`<div class="stack"><section class="hero"><h1>${t("title")}</h1><p>${t("sub")}</p><form onsubmit="event.preventDefault();location.hash='#/jobs?q='+encodeURIComponent(this.q.value)+'&city='+encodeURIComponent(this.city.value)"><input name="q" placeholder="${t("kw")}"><select name="city"><option value="">${t("allc")}</option>${CITIES.map(c=>`<option>${c}</option>`).join("")}</select><button class="btn amber">${t("search")}</button></form><p><a class="btn alt" href="#/login">📱 ${t("wlogin")}</a></p></section><div class="safe">🛡️ ${t("never")}</div><section><h2>${t("work")}</h2><div class="cats">${CATS.map(c=>`<a class="cat ${c[4]==="w"?"w":""}" href="#/jobs?cat=${c[0]}"><i>${c[1]}</i>${S.lang==="ar"?c[3]:c[2]}</a>`).join("")}</div></section><section><h2>${t("latest")}</h2><div class="grid g2">${l.map(card).join("")}</div></section></div>`};
V.jobs=q=>{const ben=q.ben?q.ben.split(","):[];const r=live().filter(j=>(!q.q||(j.title+j.desc+j.company).toLowerCase().includes(q.q.toLowerCase()))&&(!q.city||j.city===q.city)&&(!q.cat||j.cat===q.cat)&&(!q.collar||cat(j.cat)[4]===q.collar)&&ben.every(b=>j[b]));
return`<div class="layout"><aside class="card"><form class="fl" id="ff"><h3>Filters</h3><input name="q" value="${esc(q.q||"")}" placeholder="${t("kw")}"><select name="city"><option value="">${t("allc")}</option>${CITIES.map(c=>`<option ${q.city===c?"selected":""}>${c}</option>`).join("")}</select><select name="cat"><option value="">All categories</option>${CATS.map(c=>`<option value="${c[0]}" ${q.cat===c[0]?"selected":""}>${c[1]} ${S.lang==="ar"?c[3]:c[2]}</option>`).join("")}</select><select name="collar"><option value="">Workers + Professionals</option><option value="b" ${q.collar==="b"?"selected":""}>👷 Workers</option><option value="w" ${q.collar==="w"?"selected":""}>💼 Professionals</option></select>${[["visa","visa"],["acc","acc"],["trans","trans"],["food","food"],["urgent","urgent"]].map(([k,l])=>`<label class="chk"><input type="checkbox" name="ben" value="${k}" ${ben.includes(k)?"checked":""}>${t(l)}</label>`).join("")}<button class="btn">${t("search")}</button></form></aside><section class="stack"><h1>${r.length} ${t("jobs")}</h1><div class="safe">🛡️ ${t("never")}</div>${r.length?r.map(card).join(""):`<p>${t("nojobs")}</p>`}</section></div>`};
V.job=(q,id)=>{const j=S.jobs.find(x=>x.id==id);if(!j)return"<p>Job not found.</p>";const done=S.apps.find(a=>a.job==j.id);
const act=done?`<div class="ok">✔ ${t("applied")} — ${done.status}</div>`:S.role==="worker"?`<button class="btn big amber" onclick="apply(${j.id})">✅ ${t("apply")}</button>`:S.role==="guest"?`<a class="btn big amber" href="#/login">✅ ${t("apply")}</a>`:"";
const u=encodeURIComponent(j.title+" – "+j.company+" (Shughl)");
return`<div class="stack"><section class="card stack">${j.status!=="active"?`<div class="err">Preview — ${j.status}, not public</div>`:""}<h1>${esc(j.title)}</h1><div class="meta">${esc(j.company)} · ${esc(j.city)}, ${esc(j.area)}</div>${badges(j)}<div class="sal" style="font-size:1.25rem">${sal(j)}</div><div class="safe">🛡️ ${t("never")}</div>${act}<div>Share: <a target="_blank" rel="noopener" href="https://wa.me/?text=${u}">WhatsApp</a> · <a target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(location.href)}">Facebook</a> · <a target="_blank" rel="noopener" href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(location.href)}">LinkedIn</a></div></section>
<section class="card"><h2>Details</h2><table><tr><th>Category</th><td>${cname(j.cat)}</td></tr><tr><th>Type</th><td>${j.type}</td></tr><tr><th>Languages</th><td>${esc(j.langs)}</td></tr><tr><th>Vacancies</th><td>${j.vac}</td></tr></table><h2 style="margin-top:14px">Description</h2><p>${esc(j.desc)}</p></section>
<details class="card"><summary>⚠️ Report this job</summary><div class="stack"><textarea id="rr" placeholder="Why? (asks for money, fake company…)"></textarea><button class="btn danger sm" onclick="report(${j.id})">Send report</button></div></details></div>`};
V.login=()=>S.role==="worker"?"<p>You are logged in as a worker. <a href='#/apps'>My applications</a></p>":`<div class="grid g2"><section class="card stack"><h1>📱 ${t("wlogin")}</h1><p class="meta">No email or CV needed. We send a 6-digit code to your phone.</p><div id="otp"><label>${t("phone")}</label><input id="ph" type="tel" inputmode="tel" placeholder="05X XXX XXXX" style="font-size:1.25rem"><p><button class="btn big" onclick="sendOtp()">${t("send")}</button></p></div></section><section class="card"><h2>✉️ Professionals, employers, admin</h2><p class="meta">In the demo, use the role buttons at the top of the page instead.</p></section></div>`;
V.apps=()=>{if(S.role!=="worker")return"<p>Log in as a worker first.</p>";return`<div class="stack"><h1>${t("myapps")}</h1>${S.apps.length?S.apps.map(a=>{const j=S.jobs.find(x=>x.id==a.job);return`<section class="card"><h3><a href="#/job/${j.id}">${esc(j.title)}</a> <span class="pill">${a.status}</span></h3><div class="meta">${esc(j.company)} · ${esc(j.city)}</div></section>`}).join(""):`<p>No applications yet. <a href="#/jobs">${t("jobs")}</a></p>`}</div>`};
V.employer=()=>{if(S.role!=="employer")return"<p>Switch to Employer (top bar).</p>";const mine=S.jobs.filter(j=>j.company==="Gulf Star Services LLC");return`<div class="stack"><h1>🏢 Gulf Star Services LLC <span class="badge v">✔ Verified</span></h1><p><a class="btn" href="#/employer/new">+ Post a job</a></p><section class="card" style="overflow-x:auto"><h2>Your jobs</h2><table><tr><th>Job</th><th>Status</th><th>Applicants</th><th></th></tr>${mine.map(j=>`<tr><td><a href="#/job/${j.id}">${esc(j.title)}</a></td><td><span class="pill">${j.status}</span></td><td>${S.apps.filter(a=>a.job===j.id).length}</td><td>${j.status==="active"?`<button class="btn sm alt" onclick="setSt(${j.id},'paused')">Pause</button>`:j.status==="paused"?`<button class="btn sm alt" onclick="setSt(${j.id},'active')">Resume</button>`:""} ${j.status!=="closed"?`<button class="btn sm danger" onclick="setSt(${j.id},'closed')">Close</button>`:""}</td></tr>`).join("")}</table></section>${S.apps.length?`<section class="card"><h2>Applicants</h2>${S.apps.map(a=>{const j=S.jobs.find(x=>x.id==a.job);return`<p><b>Ravi Kumar</b> (Driver, India, 5 yrs) applied for ${esc(j.title)} <span class="pill">${a.status}</span><br>${["shortlisted","hired","rejected"].map(s=>`<button class="btn sm alt" onclick="setApp(${a.job},'${s}')">${s}</button>`).join(" ")}</p>`}).join("")}</section>`:""}</div>`};
V.new=()=>{if(S.role!=="employer")return"<p>Switch to Employer (top bar).</p>";return`<section class="card"><h1>Post a job</h1><div class="safe">🛡️ Jobs that ask workers for money are blocked.</div><div id="msg"></div><label>Job title</label><input id="nt" placeholder="e.g. Warehouse Helper"><div class="grid g2"><div><label>Category</label><select id="nc">${CATS.map(c=>`<option value="${c[0]}">${c[1]} ${c[2]}</option>`).join("")}</select></div><div><label>City</label><select id="ncity">${CITIES.map(c=>`<option>${c}</option>`).join("")}</select></div><div><label>Salary from (AED)</label><input id="nmin" type="number"></div><div><label>Vacancies</label><input id="nvac" type="number" value="1"></div></div><label class="chk"><input type="checkbox" id="nv">Visa provided</label><label class="chk"><input type="checkbox" id="na">Accommodation</label><label>Description</label><textarea id="nd" placeholder="Try typing: Pay AED 500 registration fee"></textarea><p><button class="btn big" onclick="postJob()">Submit for approval</button></p></section>`};
V.admin=()=>{if(S.role!=="admin")return"<p>Switch to Admin (top bar).</p>";const p=S.jobs.filter(j=>j.status==="pending");return`<div class="stack"><h1>Admin</h1><div class="grid g2"><div class="card"><div class="meta">Live jobs</div><b style="font-size:1.8rem">${live().length}</b></div><div class="card"><div class="meta">Applications</div><b style="font-size:1.8rem">${S.apps.length}</b></div></div><section class="card"><h2>⏳ Jobs awaiting approval (${p.length})</h2>${p.length?p.map(j=>`<p><b>${esc(j.title)}</b> · ${esc(j.company)}<br><button class="btn sm" onclick="setSt(${j.id},'active')">Approve</button> <button class="btn sm danger" onclick="setSt(${j.id},'rejected')">Reject</button></p>`).join(""):"<p>None. Post a job as Employer to see it here.</p>"}</section><section class="card"><h2>🚩 Reports (${S.reports.length})</h2>${S.reports.map(r=>`<p>${esc(S.jobs.find(j=>j.id==r.job)?.title||"")}: ${esc(r.reason)}<br><button class="btn sm danger" onclick="setSt(${r.job},'rejected')">Remove job</button></p>`).join("")||"<p>None.</p>"}</section></div>`};
V.pricing=()=>`<div class="stack"><h1>Pricing for employers</h1><div class="safe">Jobseekers always use Shughl for free.</div><div class="grid g2"><div class="card"><h2>Basic</h2><b style="font-size:1.8rem">Free</b><p>1 live job, applicant dashboard, messaging</p></div><div class="card"><h2>Featured Post</h2><b style="font-size:1.8rem">AED 199</b><p>Per job / 30 days. Top of results, urgent badge</p></div><div class="card"><h2>CV Database</h2><b style="font-size:1.8rem">AED 499</b><p>Per month. Candidate search and contact requests</p></div></div></div>`;
function apply(id){if(!S.apps.find(a=>a.job===id))S.apps.push({job:id,status:"applied"});save();route()}
function report(id){const r=$("#rr").value.trim();if(!r)return;S.reports.push({job:id,reason:r});save();alert("Thank you. The report was sent to the admin team.")}
function sendOtp(){const p=$("#ph").value.trim();if(!/^[+\d][\d\s()-]{7,}$/.test(p)){alert("Enter a valid phone number");return}window._c=String(Math.floor(100000+Math.random()*900000));$("#otp").innerHTML=`<label>${t("enter")} (${esc(p)})</label><input id="cd" inputmode="numeric" maxlength="6" style="font-size:1.5rem;letter-spacing:.4em;text-align:center"><div class="safe" style="margin-top:10px">DEMO — real app sends this by SMS. Your code is <b>${window._c}</b></div><p><button class="btn big" onclick="verify()">${t("verify")}</button></p>`}
function verify(){if($("#cd").value.trim()!==window._c){alert("Wrong code");return}S.role="worker";save();location.hash="#/jobs"}
function setSt(id,s){const j=S.jobs.find(x=>x.id===id);if(j)j.status=s;save();route()}
function setApp(job,s){const a=S.apps.find(x=>x.job===job);if(a)a.status=s;save();route()}
function postJob(){const ti=$("#nt").value.trim(),d=$("#nd").value.trim(),m=$("#msg");if(!ti||!d){m.innerHTML='<div class="err">Title and description are required.</div>';return}
if(SCAM.some(r=>r.test(ti+"\n"+d))){m.innerHTML='<div class="err">This post looks like it asks jobseekers for money. Shughl does not allow that. Please remove it and try again.</div>';return}
const c=$("#nc").value;S.jobs.push({id:Date.now()%1e7,title:ti,cat:c,city:$("#ncity").value,area:"",type:"full-time",min:+$("#nmin").value||0,max:+$("#nmin").value||0,per:"month",langs:"Any",visa:$("#nv").checked?1:0,acc:$("#na").checked?1:0,trans:0,food:0,vac:+$("#nvac").value||1,desc:d,urgent:0,company:"Gulf Star Services LLC",verified:1,status:"pending"});save();location.hash="#/employer"}
function route(){const h=location.hash.replace(/^#\/?/,""),[p,qs]=h.split("?"),q=Object.fromEntries(new URLSearchParams(qs||"")),seg=p.split("/");let v;
if(seg[0]==="job")v=V.job(q,seg[1]);else if(seg[0]==="employer"&&seg[1]==="new")v=V.new();else v=(V[seg[0]||"home"]||V.home)(q);
chrome();$("#app").innerHTML=v;window.scrollTo(0,0);const f=$("#ff");if(f)f.onsubmit=e=>{e.preventDefault();const d=new FormData(f),u=new URLSearchParams();for(const k of["q","city","cat","collar"])if(d.get(k))u.set(k,d.get(k));const b=d.getAll("ben");if(b.length)u.set("ben",b.join(","));location.hash="#/jobs?"+u}}
document.querySelectorAll("[data-role]").forEach(b=>b.onclick=()=>{S.role=b.dataset.role;save();location.hash=S.role==="employer"?"#/employer":S.role==="admin"?"#/admin":S.role==="worker"?"#/jobs":"#/";route()});
$("#reset").onclick=()=>{try{localStorage.removeItem("shughl_demo")}catch(e){}load();location.hash="#/";route()};
addEventListener("hashchange",route);route();
</script></body></html>
