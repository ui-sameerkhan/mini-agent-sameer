<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SitePulse — KTC International Contracting</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%2300113D%22/><text x=%2250%22 y=%2266%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22%23F9CB14%22 font-family=%22Arial%22>S</text></svg>" />
<link rel="stylesheet" href="css/style.css" />
<link rel="manifest" href="manifest.webmanifest" />
</head>
<body>

<div id="configWarning" class="config-warning hidden">
  ⚠ This deployment isn't connected to Firebase yet — open <code>web/js/firebase-init.js</code>
  and paste in the Web app config from Firebase Console → Project Settings → Your apps.
</div>

<!-- ===================== LOGIN ===================== -->
<div id="loginView" class="login-screen">
  <div class="login-card">
    <div class="brand-mark"><span class="brand-site">Site</span><span class="brand-pulse">Pulse</span></div>
    <div class="brand-sub">Verified Workforce Attendance</div>
    <div class="brand-company">KTC International Contracting</div>

    <form id="loginForm" class="login-form">
      <label>Email
        <input type="email" id="loginEmail" required autocomplete="username" />
      </label>
      <label>Password
        <input type="password" id="loginPassword" required autocomplete="current-password" />
      </label>
      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      <button type="button" id="forgotPasswordBtn" class="btn-link">Forgot password?</button>
      <div id="loginStatus" class="status-msg"></div>
    </form>
  </div>
</div>

<!-- ===================== APP SHELL ===================== -->
<div id="appShell" class="app-shell hidden">
  <header class="topbar">
    <div class="topbar-brand"><span class="brand-site">Site</span><span class="brand-pulse">Pulse</span></div>
    <div class="topbar-user">
      <button id="enableNotifsBtn" class="btn-link">🔔 Notifications</button>
      <span id="userEmailLabel"></span>
      <button id="logoutBtn" class="btn-link">Sign Out</button>
    </div>
  </header>

  <div id="announcementBanner" class="announcement-banner hidden"></div>

  <nav id="tabNav" class="tab-nav"></nav>

  <main class="view-container">
    <section id="view-checkin" class="view"></section>
    <section id="view-dashboard" class="view"></section>
    <section id="view-sites" class="view"></section>
    <section id="view-workers" class="view"></section>
    <section id="view-attendance" class="view"></section>
    <section id="view-roster" class="view"></section>
    <section id="view-officestaff" class="view"></section>
    <section id="view-backup" class="view"></section>
  </main>

  <footer class="app-footer">SitePulse — KTC International Contracting</footer>
</div>

<div id="toastHost" class="toast-host"></div>

<!-- Third-party libraries, all from CDN, no build step -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<script type="module" src="js/app.js"></script>
</body>
</html>
